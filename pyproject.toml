[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rcea-passport-engine"
version = "0.1.0"
description = "Role-Conditioned Evidentiary Adequacy (RCEA): a computable framework and evidence passport reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "RCEA Research Team" },
]
keywords = ["AI governance", "evidence passport", "auditability", "RCEA", "accountability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
notebooks = [
    "jupyter",
    "matplotlib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.hatch.build.targets.wheel]
packages = ["rcea"]
